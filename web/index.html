<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>TopkenX – Kết nối mọi AI, chỉ với một API</title>
    <meta name="title" content="TopkenX – Kết nối mọi AI, chỉ với một API" />
    <meta
      name="description"
      content="Một khóa API cho Claude, GPT, Gemini, DeepSeek, Qwen và nhiều mô hình khác. Tương thích OpenAI, dùng được với Claude Code và Codex, dùng bao nhiêu trả bấy nhiêu."
    />

    <!-- Link previews (Zalo, Facebook, Telegram, X). This template is shared
         by every route, so no canonical/og:url: they would all point home. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TopkenX" />
    <meta
      property="og:title"
      content="TopkenX – Kết nối mọi AI, chỉ với một API"
    />
    <meta
      property="og:description"
      content="Một khóa API cho Claude, GPT, Gemini, DeepSeek, Qwen và nhiều mô hình khác. Dùng bao nhiêu trả bấy nhiêu."
    />
    <meta property="og:image" content="https://topkenx.com/logo.png" />
    <meta property="og:locale" content="vi_VN" />
    <meta name="twitter:card" content="summary" />

    <meta name="theme-color" content="#0e0b08" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'dark'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
