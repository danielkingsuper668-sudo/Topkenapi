<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>TopkenX – 一个 API，连接所有 AI</title>
    <meta name="title" content="TopkenX – 一个 API，连接所有 AI" />
    <meta
      name="description"
      content="一个密钥调用 Claude、GPT、Gemini、DeepSeek、通义千问等主流大模型。兼容 OpenAI 接口，支持 Claude Code 与 Codex，按量计费，用多少付多少。"
    />

    <!-- Link previews (Zalo, Facebook, Telegram, X). This template is shared
         by every route, so no canonical/og:url: they would all point home. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TopkenX" />
    <meta
      property="og:title"
      content="TopkenX – 一个 API，连接所有 AI"
    />
    <meta
      property="og:description"
      content="一个密钥调用 Claude、GPT、Gemini、DeepSeek、通义千问等大模型，按量计费。"
    />
    <meta property="og:image" content="https://topkenx.com/logo.png" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:locale:alternate" content="vi_VN" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary" />

    <meta name="theme-color" content="#0e0b08" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'dark'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
